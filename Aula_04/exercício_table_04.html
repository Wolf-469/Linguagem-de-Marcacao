<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - table</title>
	</head>
	<body>
		<table border="1" width="100%">
		
			<tr>
				<th colspan="6">Cromograma de Aulas!</th>
			</tr>
			<tr style="text-align:center">
				<td>Segunda</td>
				<td>Terça</td>
				<td>Quarta</td>
				<td>Quinta</td>
				<td>Sexta</td>
			</tr>
			<tr style="text-align:center">
				<td>7:00 - 8:40</td>
				<td style="background-color: #B5C7EB">LP</td>
				<td style="background-color: #B5C7EB">LP</td>
				<td style="background-color: red">SENAI</td>
				<td style="background-color: red">SENAI</td>
				<td style="background-color: #FFC067 ">História</td>
			</tr>
			<tr style="text-align:center">
				<td>7:50 - 8:40</td>

				<td style="background-color: #D5F1FF">Física</td>
				<td style="background-color: #FFC067">História</td>
				
			</tr>
			<tr>
				<td>9:30 - 9:50</td>
				<td colspan="6" style="text-align:center">Intervalo</td>
			</tr>
			<tr style="text-align:center">
				<td>7:50 - 8:40</td>
				<td style="background-color: #B5C7EB">Lp</td>
				<td style="background-color: #D5F1FF">Física</td>
				<td style="background-color: #FFC067">História</td>
			</tr>
			
		</table>
	
	</body>
</html>
