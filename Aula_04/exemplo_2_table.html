<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - table</title>
	</head>
	<body>
		<table border="1" width="100%">
			<tr style="background-color:purple; color: white">
				<th>Cabeçalho 1</th>
				<th>Cabeçalho 2 </th>
				<th>Cabeçalho 3 </th>
			</tr>
			<tr>
				<td style= "background-color:#000;color:#FFF;">Conteúdo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style= "background-color:yellow;">1 </td>
							<td style="background-color:red; color: #FFF; text-align:rigth;">2</td>
						</tr>
						<tr>
							<td style="background-color:blue; color: #FFF; text-align:rigth;" >3</td>
							<td style="background-color:greenyellow;">4</td>
						</tr>
					</table>
					
				</td>
					<td style= "background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');">Conteúdo 3 </td>
				</tr>
				<tr> 
					<td style= "background-color:#000;color:#FFF;">Conteúdo 4</td>
					<td style= "background-image:url('https://down-br.img.susercontent.com/file/39c8f1d915758d943faff79b08ea986b'); text-align: right">Conteúdo 5 </td>
					<td>
						<table border="1" width="100%">
						<tr>
							<td style= "background-color:orange; text-align:center;">5</td>
							<td style="background-color:pink;">6</td>
						</tr>
						<tr>
							<td style="background-color:red; text-align:rigth;" >7</td>
							<td style="background-color:orange; text-align:center;">8</td>
						</tr>
					</table>
					
				</td>
				</tr>
			
		</table>
	</body>
</html>
